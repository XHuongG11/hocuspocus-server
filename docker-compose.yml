version: "3.8"

services:
  hocuspocus-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hocuspocus-server
    ports:
      - "1234:1234"
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      - memap-network

networks:
  memap-network:
    driver: bridge
